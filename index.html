<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Realistic Ocean - Ambient Sound</title>
  
  <base href="./">

  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-environment-component@1.3.7/dist/aframe-environment-component.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>
  
  <style>
    /* THE MAIN MENU SCREEN OVERLAY */
    #main-menu {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(1, 22, 43, 0.5); 
      backdrop-filter: blur(4px);       
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      transition: opacity 0.5s ease-out;
    }

    #menu-title {
      color: white;
      font-size: 48px;
      letter-spacing: 4px;
      margin-bottom: 30px;
      text-transform: uppercase;
      text-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5);
    }

    #audio-button {
      padding: 18px 40px;
      font-size: 20px;
      font-weight: bold;
      color: white;
      background: #346fa8;
      border: 2px solid white;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #audio-button:hover {
      background: #29547d;
      transform: scale(1.05);
    }

    /* ⏱️ SURVIVAL HUD CLOCK STYLE */
    #survival-hud {
      position: fixed;
      top: 25px;
      right: 30px;
      z-index: 999;
      display: none; 
      background: rgba(0, 10, 20, 0.35);
      padding: 12px 25px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      font-family: 'Courier New', Courier, monospace;
      color: #64dfdf;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 2px;
      text-align: center;
    }

    /* 💧 HYDRATION BAR CONTAINER HUD STYLE */
    #hydration-bar-container {
      position: fixed;
      top: 25px;
      left: 30px;
      z-index: 999;
      display: none;
      width: 240px;
      height: 14px;
      background: rgba(0, 0, 0, 0.2);
      border: 4px solid #2a2833;
      border-radius: 20px;
      padding: 2px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    #hydration-bar-fluid {
      width: 100%;
      height: 100%;
      background-color: #2e3085;
      border-radius: 20px;
      transition: width 0.3s ease, background-color 0.5s ease;
    }

    /* ❤️ HEALTH BAR CONTAINER HUD STYLE */
    #health-bar-container {
      position: fixed;
      top: 65px;
      left: 30px;
      z-index: 999;
      display: none;
      width: 240px;
      height: 14px;
      background: rgba(0, 0, 0, 0.2);
      border: 4px solid #2a2833;
      border-radius: 20px;
      padding: 2px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    #health-bar-fluid {
      width: 100%;
      height: 100%;
      background-color: #2E8562;
      border-radius: 20px;
      transition: width 0.3s ease, background-color 0.5s ease;
    }

    /* 🖤 FULL BLACK GAME OVER SCREEN FOR LOSING */
    #game-over-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      z-index: 10000;
      display: none; 
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #game-over-text {
      color: #ffffff;
      font-size: 64px;
      font-weight: bold;
      letter-spacing: 6px;
      text-transform: uppercase;
      text-shadow: 0px 4px 15px rgba(255, 255, 255, 0.2);
    }

    #game-over-screen[style*="display: flex"] {
      animation: textFadeIn 1.5s ease-out forwards;
    }

    /* 🚁 WHITE SCREEN OVERLAY FOR WINNING */
    #win-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      z-index: 10000;
      display: none; 
      opacity: 0;
    }

    /* 🎬 WHITE FADE ANIMATION (Takes 2.5s, starts after 1.5s freeze) */
    #win-screen[style*="display: flex"] {
      animation: spotlightFadeIn 2.5s ease-in 1.5s forwards; 
    }

    /* 📄 INDIVIDUAL FULL-SCREEN STORY SLIDES */
    .story-slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none; /* Hidden by default */
      justify-content: center;
      align-items: center;
      padding: 0 60px;
      box-sizing: border-box;
      text-align: center;
    }

    /* Displays the active slide */
    .story-slide.active-slide {
      display: flex !important;
    }

    /* ✍️ NEW BIG, BOLD, CENTERED STYLE FOR WIN TEXT (Matches Menu UI Theme) */
    .story-text {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 38px;
      font-weight: bold;
      color: #01162b;
      line-height: 1.5;
      max-width: 950px;
      margin: 0 auto;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* 🔤 LETTER FADE-IN ENGINE STYLING */
    .letter-span {
      display: inline-block;
      opacity: 0;
      transform: translateY(5px);
      animation: letterReveal 0.4s ease-out forwards;
    }

    /* Space preservation fix for parsed letter-spans */
    .space-span {
      display: inline-block;
      width: 0.28em;
    }

    /* 📽️ ANIMATION KEYFRAMES */
    @keyframes spotlightFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes textFadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes letterReveal {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div id="main-menu">
    <h1 id="menu-title">Lost At Sea</h1>
    <button id="audio-button">Survive...</button>
  </div>

  <div id="survival-hud">TIME: 05:00 AM</div>
  
  <div id="hydration-bar-container">
    <div id="hydration-bar-fluid"></div>
  </div>

  <div id="health-bar-container">
    <div id="health-bar-fluid"></div>
  </div>

  <div id="game-over-screen">
    <div id="game-over-text">GAME OVER</div>
  </div>

  <div id="win-screen">
    <div class="story-slide" id="slide-1">
      <p class="story-text" data-text="Congratulations, you survived."></p>
    </div>
    
    <div class="story-slide" id="slide-2">
      <p class="story-text" data-text="After hours of being in the open ocean, rescue has finally arrived."></p>
    </div>
    
    <div class="story-slide" id="slide-3">
      <p class="story-text" data-text="The search team spotted your signal of the phone and safely saved you, bringing you inside the helicopter, where medical assistance is already waiting."></p>
    </div>
    
    <div class="story-slide" id="slide-4">
      <p class="story-text" data-text="What began as a fight for survival has become a story you'll carry with you for the rest of your life."></p>
    </div>

    <div class="story-slide" id="slide-5">
      <p class="story-text" data-text="a tale that may one day be passed on to future generations."></p>
    </div>
  </div>

  <a-scene id="scene" ring-spawner="playerRig: #rig; enabled: false; minSpawnRadius: 15; maxSpawnRadius: 40" bottle-spawner="playerRig: #rig; enabled: false">
    
    <a-assets>
      <a-asset-item id="boat-model" src="assets/models/fishing_boat.glb"></a-asset-item>
      <a-asset-item id="bottle-model" src="assets/models/water_canteen_-_pbr_game_ready_asset.glb"></a-asset-item>
      <a-asset-item id="shark-model" src="assets/models/swimming_shark.glb"></a-asset-item>
    </a-assets>

    <a-entity environment="
      preset: dream; 
      skyType: gradient; 
      skyColor: #415366; 
      horizonColor: #7f8c9d; 
      dressing: none; 
      ground: none; 
      lighting: distant; 
      sunPosition: 0 4 -20
    "></a-entity>

    <a-entity id="rig" 
              position="0 0 0" 
              wasd-controls="enabled: false; acceleration: 25"
              look-controls="enabled: false; pointerLockEnabled: true"
              boat-leveler>

      <a-entity id="camera"
                camera
                position="0 3.5 0">
      </a-entity>
      
      <a-entity id="player-boat"
                gltf-model="#boat-model"
                position="0 3.2 -0.5"
                rotation="0 180 0"
                scale="5 5 5"
                visible="false">
      </a-entity>

    </a-entity>

    <a-entity id="ocean" 
              ocean="density: 50; amplitude: 0.8; width: 1000; depth: 1000; speed: 1.2"
              material="
                color: #346fa8; 
                roughness: 0.15; 
                metalness: 0.7; 
                opacity: 0.85; 
                transparent: true;
                repeat: 50 50;
                normalMap: https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/waternormals.jpg;
                normalTextureRepeat: 50 50;
              "
              rotation="-90 0 0"
              class="collidable"
              ocean-animator>
    </a-entity>

    <a-cylinder id="ocean-depth"
                position="0 -26.5 0"
                radius="500"
                height="50"
                material="color: #29547d; roughness: 1; metalness: 0; side: double">
    </a-cylinder>
  </a-scene>

  <script>
    // 🎵 NATIVE JAVASCRIPT AUDIO ENGINE Setup
    const ambientSeaSound = new Audio("assets/models/ocean_survival2.mp3");
    ambientSeaSound.loop = true;
    ambientSeaSound.volume = 0.8;

    const helicopterRescueSound = new Audio("assets/models/helicopter.mp3");
    helicopterRescueSound.loop = false;
    helicopterRescueSound.volume = 0.9;

    let gameHours = 5;
    let gameMinutes = 0;
    let clockInterval = null;
    
    let currentHydrationValue = 100;
    let hydrationDrainInterval = null;

    let currentHealthValue = 100;
    let healthSystemActive = false; 

    document.getElementById('audio-button').addEventListener('click', function() {
      // 🔊 Instantly kick off the sea ambient track natively
      ambientSeaSound.play().catch(err => console.log("Audio play error: ", err));

      var rig = document.getElementById('rig');
      if (rig) {
        rig.setAttribute('wasd-controls', 'enabled: true');
        rig.setAttribute('look-controls', 'enabled: true');
      }

      var boat = document.getElementById('player-boat');
      if (boat) {
        boat.setAttribute('visible', 'true');
      }

      var scene = document.getElementById('scene');
      if (scene) {
        scene.setAttribute('ring-spawner', 'enabled: true');
        scene.setAttribute('bottle-spawner', 'enabled: true');
        scene.emit('start-spawning');
      }

      var hud = document.getElementById('survival-hud');
      if (hud) hud.style.display = 'block';
      
      var hydrationHUD = document.getElementById('hydration-bar-container');
      if (hydrationHUD) hydrationHUD.style.display = 'block';

      var healthHUD = document.getElementById('health-bar-container');
      if (healthHUD) healthHUD.style.display = 'block';
      
      startSurvivalClock();
      startSurvivalDrainSystems();
      healthSystemActive = true;

      var menu = document.getElementById('main-menu');
      if (menu) {
        menu.style.opacity = '0';
        setTimeout(function() {
          menu.style.display = 'none';
        }, 500); 
      }
    });

    function startSurvivalClock() {
      clockInterval = setInterval(() => {
        gameMinutes += 15;
        if (gameMinutes >= 60) {
          gameMinutes = 0;
          gameHours += 1;
        }
        let displayHours = gameHours.toString().padStart(2, '0');
        let displayMinutes = gameMinutes.toString().padStart(2, '0');
        let hudElement = document.getElementById('survival-hud');
        if (hudElement) hudElement.innerText = `TIME: ${displayHours}:${displayMinutes} AM`;

        // 🏆 WIN CONDITION REACHED AT 7:00 AM
        if (gameHours === 7 && gameMinutes === 0) {
          triggerWin();
        }
      }, 30000); 
    }

    function startSurvivalDrainSystems() {
      hydrationDrainInterval = setInterval(() => {
        let newHydrationTotal = currentHydrationValue - 10;
        if (newHydrationTotal <= 0) {
          newHydrationTotal = 0;
          updateHydrationBarDisplay(newHydrationTotal);
          
          let newHealthTotal = currentHealthValue - 5;
          if (newHealthTotal <= 0) {
            newHealthTotal = 0;
            updateHealthBarDisplay(newHealthTotal);
            triggerLoss(); // 💀 Trigger the standard black game over screen
          } else {
            updateHealthBarDisplay(newHealthTotal);
          }
        } else {
          updateHydrationBarDisplay(newHydrationTotal);
        }
      }, 10000);
    }

    // 💀 LOSING ENDING (Pitch black screen)
    function triggerLoss() {
      clearInterval(hydrationDrainInterval);
      clearInterval(clockInterval);
      healthSystemActive = false;
      
      // 🔇 Cut the ocean track right away
      ambientSeaSound.pause();
      ambientSeaSound.currentTime = 0;
      
      let rig = document.getElementById('rig');
      if (rig) rig.setAttribute('wasd-controls', 'enabled: false');
      
      let scene = document.getElementById('scene');
      if (scene) {
        scene.setAttribute('ring-spawner', 'enabled: false');
        scene.setAttribute('bottle-spawner', 'enabled: false');
      }
      
      let screenElement = document.getElementById('game-over-screen');
      if (screenElement) screenElement.style.display = 'flex';
    }

    // 🚁 WINNING ENDING (Helicopter rescue, screen turns white, story loops dynamically)
    function triggerWin() {
      clearInterval(hydrationDrainInterval);
      clearInterval(clockInterval);
      healthSystemActive = false;
      
      // 🔇 Kill the ocean track right away
      ambientSeaSound.pause();
      ambientSeaSound.currentTime = 0;

      // 🔊 Fire up the Helicopter Rescue track smoothly
      helicopterRescueSound.play().catch(err => console.log("Audio play error: ", err));
      
      let rig = document.getElementById('rig');
      if (rig) rig.setAttribute('wasd-controls', 'enabled: false');
      
      let scene = document.getElementById('scene');
      if (scene) {
        scene.setAttribute('ring-spawner', 'enabled: false');
        scene.setAttribute('bottle-spawner', 'enabled: false');
        
        // Wipe all remaining water bottles off the map
        let existingBottles = scene.querySelectorAll('[gltf-model="#bottle-model"]');
        existingBottles.forEach(bottle => {
          if (bottle.parentNode) bottle.parentNode.removeChild(bottle);
        });

        // Wipe all dangerous rings and sharks off the map
        let existingRings = scene.querySelectorAll('a-entity[wave-rider]');
        existingRings.forEach(ring => {
          if (ring.id !== 'rig') {
            if (ring.parentNode) ring.parentNode.removeChild(ring);
          }
        });
      }
      
      // Show screen overlay, triggering the delayed 2.5s white flash animation
      let winElement = document.getElementById('win-screen');
      if (winElement) winElement.style.display = 'flex';

      // ⏱️ THE SEQUENTIAL 6-SECOND TIMEOUT CHAIN (Ensures clean slide swaps)
      // 1.5s freeze + 2.5s fade = 6000ms until screen turns completely solid white
      
      // Screen 1: Shows up instantly when white out finishes
      setTimeout(() => {
        showStorySlide(1);
      }, 6000);

      // Screen 2: Swaps after 6 seconds
      setTimeout(() => {
        showStorySlide(2);
      }, 12000);

      // Screen 3: Swaps after 6 seconds
      setTimeout(() => {
        showStorySlide(3);
      }, 18000);

      // Screen 4: Swaps after 6 seconds
      setTimeout(() => {
        showStorySlide(4);
      }, 24000);

      // Screen 5: Swaps after 6 seconds
      setTimeout(() => {
        showStorySlide(5);
      }, 30000);
    }

    // Swaps active story page visibility classes cleanly and runs the letter animation
    function showStorySlide(slideNumber) {
      let activeSlide = document.querySelector('.story-slide.active-slide');
      if (activeSlide) {
        activeSlide.classList.remove('active-slide');
      }

      let targetSlide = document.getElementById(`slide-${slideNumber}`);
      if (targetSlide) {
        targetSlide.classList.add('active-slide');
        
        // Find text block container and target raw data string
        let txtElement = targetSlide.querySelector('.story-text');
        let rawPhrase = txtElement.getAttribute('data-text');
        txtElement.innerHTML = ''; // Reset container cleanly

        // Transform string characters into animated elements
        let characterArray = rawPhrase.split('');
        characterArray.forEach((char, idx) => {
          let charSpan = document.createElement('span');
          if (char === ' ') {
            charSpan.className = 'space-span';
            charSpan.innerHTML = '&nbsp;';
          } else {
            charSpan.className = 'letter-span';
            charSpan.innerText = char;
            // Increases delay linearly per character for a progressive letter wave fade-in
            charSpan.style.animationDelay = `${idx * 25}ms`;
          }
          txtElement.appendChild(charSpan);
        });
      }
    }

    function collectWaterBottle() {
      let restoredHydrationTotal = Math.min(100, currentHydrationValue + 5);
      updateHydrationBarDisplay(restoredHydrationTotal);
    }

    function updateHydrationBarDisplay(targetPercentage) {
      currentHydrationValue = Math.max(0, Math.min(100, targetPercentage));
      let fluidElement = document.getElementById('hydration-bar-fluid');
      if (fluidElement) {
        fluidElement.style.width = `${currentHydrationValue}%`;
        if (currentHydrationValue > 50) {
          fluidElement.style.backgroundColor = "#2e3085";
        } else if (currentHydrationValue <= 50 && currentHydrationValue > 35) {
          fluidElement.style.backgroundColor = "#45235c";
        } else {
          fluidElement.style.backgroundColor = "#732536";
        }
      }
    }

    function updateHealthBarDisplay(targetPercentage) {
      currentHealthValue = Math.max(0, Math.min(100, targetPercentage));
      let fluidElement = document.getElementById('health-bar-fluid');
      if (fluidElement) {
        fluidElement.style.width = `${currentHealthValue}%`;
        if (currentHealthValue > 50) {
          fluidElement.style.backgroundColor = "#2E8562";
        } else if (currentHealthValue <= 50 && currentHealthValue > 35) {
          fluidElement.style.backgroundColor = "#785122";
        } else {
          fluidElement.style.backgroundColor = "#732536";
        }
      }
    }

    AFRAME.registerComponent('boat-leveler', {
      tick: function () {
        let currentRotation = this.el.object3D.rotation;
        this.el.object3D.rotation.set(0, currentRotation.y, 0);
      }
    });

    // 🍾 BOTTLE SPAWNER COMPONENT
    AFRAME.registerComponent('bottle-spawner', {
      schema: {
        playerRig: { type: 'selector' },
        enabled: { default: false },
        maxBottles: { default: 25 },         
        spawnDelay: { default: 8000 },      
        minRadius: { default: 20 },
        maxRadius: { default: 350 }
      },
      init: function () {
        this.activeBottles = [];
        
        this.el.addEventListener('start-spawning', () => {
          for (let i = 0; i < this.data.maxBottles; i++) {
            this.spawnBottle();
          }
        });
      },
      tick: function () {
        if (!this.data.enabled || !this.data.playerRig) return;

        let playerPos = this.data.playerRig.object3D.position;
        for (let i = this.activeBottles.length - 1; i >= 0; i--) {
          let bottleEl = this.activeBottles[i];
          let bottlePos = bottleEl.object3D.position;
          
          let dx = playerPos.x - bottlePos.x;
          let dz = playerPos.z - bottlePos.z;
          let distance = Math.sqrt(dx * dx + dz * dz);

          if (distance < 3.5) { 
            collectWaterBottle(); 
            this.removeBottle(bottleEl, false); 
          }
        }
      },
      spawnBottle: function () {
        let playerPos = this.data.playerRig.object3D.position;
        
        let angle = Math.random() * Math.PI * 2;
        let distance = Math.random() * (this.data.maxRadius - this.data.minRadius) + this.data.minRadius;
        
        let spawnX = playerPos.x + Math.cos(angle) * distance;
        let spawnZ = playerPos.z + Math.sin(angle) * distance;

        let bottle = document.createElement('a-entity');
        bottle.setAttribute('gltf-model', '#bottle-model');
        bottle.setAttribute('position', `${spawnX} 0.3 ${spawnZ}`); 
        bottle.setAttribute('scale', '4 4 4'); 
        
        bottle.setAttribute('wave-rider', {
          amplitude: 0.05,
          speed: 1.
