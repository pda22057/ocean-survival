<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Realistic Ocean - Ambient Sound</title>
  
  <base href="./">

  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-environment-component@1.3.7/dist/aframe-environment-component.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>
  
  <style>
    /* THE MAIN MENU SCREEN OVERLAY */
    #main-menu {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(1, 22, 43, 0.5); 
      backdrop-filter: blur(4px);       
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      transition: opacity 0.5s ease-out;
    }

    #menu-title {
      color: white;
      font-size: 48px;
      letter-spacing: 4px;
      margin-bottom: 30px;
      text-transform: uppercase;
      text-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5);
    }

    #audio-button {
      padding: 18px 40px;
      font-size: 20px;
      font-weight: bold;
      color: white;
      background: #346fa8;
      border: 2px solid white;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #audio-button:hover {
      background: #29547d;
      transform: scale(1.05);
    }

    /* ⏱️ SURVIVAL HUD CLOCK STYLE */
    #survival-hud {
      position: fixed;
      top: 25px;
      right: 30px;
      z-index: 999;
      display: none; 
      background: rgba(0, 10, 20, 0.35);
      padding: 12px 25px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      font-family: 'Courier New', Courier, monospace;
      color: #64dfdf;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 2px;
      text-align: center;
    }

    /* 💧 HYDRATION BAR CONTAINER HUD STYLE */
    #hydration-bar-container {
      position: fixed;
      top: 25px;
      left: 30px;
      z-index: 999;
      display: none;
      width: 240px;
      height: 14px;
      background: rgba(0, 0, 0, 0.2);
      border: 4px solid #2a2833;
      border-radius: 20px;
      padding: 2px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    #hydration-bar-fluid {
      width: 100%;
      height: 100%;
      background-color: #2e3085;
      border-radius: 20px;
      transition: width 0.3s ease, background-color 0.5s ease;
    }

    /* ❤️ HEALTH BAR CONTAINER HUD STYLE */
    #health-bar-container {
      position: fixed;
      top: 65px;
      left: 30px;
      z-index: 999;
      display: none;
      width: 240px;
      height: 14px;
      background: rgba(0, 0, 0, 0.2);
      border: 4px solid #2a2833;
      border-radius: 20px;
      padding: 2px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    #health-bar-fluid {
      width: 100%;
      height: 100%;
      background-color: #2E8562;
      border-radius: 20px;
      transition: width 0.3s ease, background-color 0.5s ease;
    }

    /* 🖤 FULL BLACK GAME OVER OVERLAY SCREEN */
    #game-over-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      z-index: 10000;
      display: none; 
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #game-over-text {
      color: #ffffff;
      font-size: 64px;
      font-weight: bold;
      letter-spacing: 6px;
      text-transform: uppercase;
      text-shadow: 0px 4px 15px rgba(255, 255, 255, 0.2);
      margin-bottom: 15vh;
    }

    #game-over-screen[style*="display: flex"] #game-over-text {
      animation: textFadeIn 1.5s ease-out forwards;
    }

    @keyframes textFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <div id="main-menu">
    <h1 id="menu-title">Lost At Sea</h1>
    <button id="audio-button">Survive...</button>
  </div>

  <div id="survival-hud">TIME: 05:00 AM</div>
  
  <div id="hydration-bar-container">
    <div id="hydration-bar-fluid"></div>
  </div>

  <div id="health-bar-container">
    <div id="health-bar-fluid"></div>
  </div>

  <div id="game-over-screen">
    <div id="game-over-text">GAME OVER</div>
  </div>

  <a-scene id="scene" ring-spawner="playerRig: #rig; enabled: false; minSpawnRadius: 15; maxSpawnRadius: 40" bottle-spawner="playerRig: #rig; enabled: false">
    
    <a-assets>
      <audio id="ambient-sea" 
             src="https://cdn.pixabay.com/audio/2022/03/15/audio_73d4ec7759.mp3" 
             preload="auto" 
             loop="true"></audio>
      <a-asset-item id="boat-model" src="assets/models/fishing_boat.glb"></a-asset-item>
      <a-asset-item id="bottle-model" src="assets/models/water_canteen_-_pbr_game_ready_asset.glb"></a-asset-item>
      <a-asset-item id="shark-model" src="assets/models/swimming_shark.glb"></a-asset-item>
    </a-assets>

    <a-entity environment="
      preset: dream; 
      skyType: gradient; 
      skyColor: #415366; 
      horizonColor: #7f8c9d; 
      dressing: none; 
      ground: none; 
      lighting: distant; 
      sunPosition: 0 4 -20
    "></a-entity>

    <a-entity id="rig" 
              position="0 0 0" 
              wasd-controls="enabled: false; acceleration: 25"
              look-controls="enabled: false; pointerLockEnabled: true"
              sound="src: #ambient-sea; autoplay: false; loop: true; volume: 0.8"
              boat-leveler>

      <a-entity id="camera"
                camera
                position="0 3.5 0">
      </a-entity>
      
      <a-entity id="player-boat"
                gltf-model="#boat-model"
                position="0 3.2 -0.5"
                rotation="0 180 0"
                scale="5 5 5"
                visible="false">
      </a-entity>

    </a-entity>

    <a-entity id="ocean" 
              ocean="density: 50; amplitude: 0.8; width: 1000; depth: 1000; speed: 1.2"
              material="
                color: #346fa8; 
                roughness: 0.15; 
                metalness: 0.7; 
                opacity: 0.85; 
                transparent: true;
                repeat: 50 50;
                normalMap: https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/waternormals.jpg;
                normalTextureRepeat: 50 50;
              "
              rotation="-90 0 0"
              class="collidable"
              ocean-animator>
    </a-entity>

    <a-cylinder id="ocean-depth"
                position="0 -26.5 0"
                radius="500"
                height="50"
                material="color: #29547d; roughness: 1; metalness: 0; side: double">
    </a-cylinder>

  </a-scene>

  <script>
    let gameHours = 5;
    let gameMinutes = 0;
    let clockInterval = null;
    
    let currentHydrationValue = 100;
    let hydrationDrainInterval = null;

    let currentHealthValue = 100;
    let healthSystemActive = false; 

    document.getElementById('audio-button').addEventListener('click', function() {
      var rig = document.getElementById('rig');
      if (rig) {
        rig.setAttribute('wasd-controls', 'enabled: true');
        rig.setAttribute('look-controls', 'enabled: true');
        
        if (rig.components && rig.components.sound) {
          rig.components.sound.playSound(); 
        }
      }

      var boat = document.getElementById('player-boat');
      if (boat) {
        boat.setAttribute('visible', 'true');
      }

      var scene = document.getElementById('scene');
      if (scene) {
        scene.setAttribute('ring-spawner', 'enabled: true');
        scene.setAttribute('bottle-spawner', 'enabled: true');
        scene.emit('start-spawning');
      }

      var hud = document.getElementById('survival-hud');
      if (hud) hud.style.display = 'block';
      
      var hydrationHUD = document.getElementById('hydration-bar-container');
      if (hydrationHUD) hydrationHUD.style.display = 'block';

      var healthHUD = document.getElementById('health-bar-container');
      if (healthHUD) healthHUD.style.display = 'block';
      
      startSurvivalClock();
      startSurvivalDrainSystems();
      healthSystemActive = true;

      var menu = document.getElementById('main-menu');
      if (menu) {
        menu.style.opacity = '0';
        setTimeout(function() {
          menu.style.display = 'none';
        }, 500); 
      }
    });

    function startSurvivalClock() {
      clockInterval = setInterval(() => {
        gameMinutes += 15;
        if (gameMinutes >= 60) {
          gameMinutes = 0;
          gameHours += 1;
        }
        let displayHours = gameHours.toString().padStart(2, '0');
        let displayMinutes = gameMinutes.toString().padStart(2, '0');
        let hudElement = document.getElementById('survival-hud');
        if (hudElement) hudElement.innerText = `TIME: ${displayHours}:${displayMinutes} AM`;
      }, 30000); 
    }

    function startSurvivalDrainSystems() {
      hydrationDrainInterval = setInterval(() => {
        let newHydrationTotal = currentHydrationValue - 10;
        if (newHydrationTotal <= 0) {
          newHydrationTotal = 0;
          updateHydrationBarDisplay(newHydrationTotal);
          
          let newHealthTotal = currentHealthValue - 5;
          if (newHealthTotal <= 0) {
            newHealthTotal = 0;
            updateHealthBarDisplay(newHealthTotal);
            triggerGameOver();
          } else {
            updateHealthBarDisplay(newHealthTotal);
          }
        } else {
          updateHydrationBarDisplay(newHydrationTotal);
        }
      }, 10000);
    }

    function triggerGameOver() {
      clearInterval(hydrationDrainInterval);
      clearInterval(clockInterval);
      healthSystemActive = false;
      let scene = document.getElementById('scene');
      if (scene) {
        scene.setAttribute('ring-spawner', 'enabled: false');
        scene.setAttribute('bottle-spawner', 'enabled: false');
      }
      let screenElement = document.getElementById('game-over-screen');
      if (screenElement) screenElement.style.display = 'flex';
      
      let rig = document.getElementById('rig');
      if (rig) rig.setAttribute('wasd-controls', 'enabled: false');
    }

    function collectWaterBottle() {
      let restoredHydrationTotal = Math.min(100, currentHydrationValue + 5);
      updateHydrationBarDisplay(restoredHydrationTotal);
    }

    function updateHydrationBarDisplay(targetPercentage) {
      currentHydrationValue = Math.max(0, Math.min(100, targetPercentage));
      let fluidElement = document.getElementById('hydration-bar-fluid');
      if (fluidElement) {
        fluidElement.style.width = `${currentHydrationValue}%`;
        if (currentHydrationValue > 50) {
          fluidElement.style.backgroundColor = "#2e3085";
        } else if (currentHydrationValue <= 50 && currentHydrationValue > 35) {
          fluidElement.style.backgroundColor = "#45235c";
        } else {
          fluidElement.style.backgroundColor = "#732536";
        }
      }
    }

    function update
