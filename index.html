<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Realistic Ocean - Ambient Sound</title>
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>
  
  <style>
    /* THE MAIN MENU SCREEN OVERLAY */
    #main-menu {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(1, 22, 43, 0.4); 
      backdrop-filter: blur(3px);       
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      transition: opacity 0.5s ease-out;
    }

    #menu-title {
      color: white;
      font-size: 48px;
      letter-spacing: 4px;
      margin-bottom: 30px;
      text-transform: uppercase;
      text-shadow: 0px 4px 10px rgba(0, 0, 0, 0.7);
    }

    #audio-button {
      padding: 18px 40px;
      font-size: 20px;
      font-weight: bold;
      color: white;
      background: #346fa8;
      border: 2px solid white;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #audio-button:hover {
      background: #29547d;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div id="main-menu">
    <h1 id="menu-title">Lost At Sea</h1>
    <button id="audio-button">Survive...</button>
  </div>

  <a-scene id="scene" ring-spawner="playerRig: #rig; enabled: false">
    
    <a-assets>
      <audio id="ambient-sea" 
             src="https://cdn.pixabay.com/audio/2022/03/15/audio_73d4ec7759.mp3" 
             preload="auto" 
             loop="true"></audio>
    </a-assets>

    <a-entity environment="
      preset: dream; 
      skyType: gradient; 
      skyColor: #415366; 
      horizonColor: #7f8c9d; 
      dressing: none; 
      ground: none; 
      lighting: distant; 
      sunPosition: 0 4 -20
    "></a-entity>

    <a-entity id="rig" 
              position="0 0 0" 
              wave-rider="amplitude: 0.25; speed: 1.2; eyeHeight: 0.6"
              sound="src: #ambient-sea; autoplay: false; loop: true; volume: 0.8">
      <a-entity id="camera" camera look-controls wasd-controls="enabled: false; acceleration: 25"></a-entity>
    </a-entity>

    <a-entity id="ocean" 
              ocean="density: 50; amplitude: 0.4; width: 1000; depth: 1000; speed: 1.2"
              material="
                color: #346fa8; 
                roughness: 0.15; 
                metalness: 0.7; 
                opacity: 0.85; 
                transparent: true;
                repeat: 50 50;
                normalMap: https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/waternormals.jpg;
                normalTextureRepeat: 50 50;
              "
              rotation="-90 0 0"
              class="collidable"
              ocean-animator>
    </a-entity>

    <a-cylinder id="ocean-depth"
                position="0 -26.5 0"
                radius="500"
                height="50"
                material="color: #29547d; roughness: 1; metalness: 0; side: double">
    </a-cylinder>

  </a-scene>

  <script>
    // Menu Controller & Game Starter Trigger
    document.getElementById('audio-button').addEventListener('click', function() {
      var rig = document.getElementById('rig');
      rig.components.sound.playSound(); 

      var camera = document.getElementById('camera');
      camera.setAttribute('wasd-controls', 'enabled: true');

      var scene = document.getElementById('scene');
      scene.setAttribute('ring-spawner', 'enabled: true');

      var menu = document.getElementById('main-menu');
      menu.style.opacity = '0';
      setTimeout(function() {
        menu.style.display = 'none';
      }, 500); 
    });

    // GAME SPANNER: Highly responsive localized ring generator
    AFRAME.registerComponent('ring-spawner', {
      schema: {
        playerRig: { type: 'selector' },     
        enabled: { default: false },
        spawnMinTime: { default: 1000 },    
        spawnMaxTime: { default: 6000 },    
        maxActiveRings: { default: 2 },     
        ringRadius: { default: 10 },        
        ringLifespan: { default: 6000 },    
        minSpawnRadius: { default: 2 },     
        maxSpawnRadius: { default: 15 }     
      },
      init: function () {
        this.activeRings = [];
        this.timer = 0;
        this.nextSpawnTime = this.getNewSpawnTime();
      },
      getNewSpawnTime: function () {
        return Math.random() * (this.data.spawnMaxTime - this.data.spawnMinTime) + this.data.spawnMinTime;
      },
      tick: function (time, timeDelta) {
        if (!this.data.enabled) return;

        this.timer += timeDelta;

        if (this.timer >= this.nextSpawnTime) {
          this.timer = 0;
          this.nextSpawnTime = this.getNewSpawnTime();
          
          if (this.activeRings.length < this.data.maxActiveRings) {
            this.spawnRing();
          }
        }
      },
      spawnRing: function () {
        if (!this.data.playerRig) return;

        let playerPos = this.data.playerRig.object3D.position;
        let attempts = 0;
        let validPosition = false;
        let spawnX = 0;
        let spawnZ = 0;
        let rSize = this.data.ringRadius;
        let minClearance = 25; 

        while (!validPosition && attempts < 45) {
          attempts++;
          
          let angle = Math.random() * Math.PI * 2;
          let relativeDistance = Math.random() * (this.data.maxSpawnRadius - this.data.minSpawnRadius) + this.data.minSpawnRadius;
          
          spawnX = playerPos.x + (Math.cos(angle) * relativeDistance);
          spawnZ = playerPos.z + (Math.sin(angle) * relativeDistance);

          validPosition = true;

          for (let i = 0; i < this.activeRings.length; i++) {
            let activeRing = this.activeRings[i];
            let existingPos = activeRing.getAttribute('position');
            
            if (existingPos) {
              let dx = spawnX - existingPos.x;
              let dz = spawnZ - existingPos.z;
              let currentDist = Math.sqrt(dx * dx + dz * dz);

              if (currentDist < minClearance) {
                validPosition = false;
                break;
              }
            }
          }
        }

        if (!validPosition) return; 

        let ringWrapper = document.createElement('a-entity');
        ringWrapper.setAttribute('position', `${spawnX} 0 ${spawnZ}`);
        
        // Rings use the mathematical floating engine as well so they match your rhythm
        ringWrapper.setAttribute('wave-rider', {
          amplitude: 0.15,
          speed: 1.2,
          eyeHeight: 0.01
        });

        let innerFill = document.createElement('a-ring');
        innerFill.setAttribute('radius-inner', '0');
        innerFill.setAttribute('radius-outer', rSize);
        innerFill.setAttribute('rotation', '-90 0 0');
        innerFill.setAttribute('material', 'color: #ff0000; opacity: 0.6; transparent: true; roughness: 1; metalness: 0');

        let outerBorder = document.createElement('a-ring');
        outerBorder.setAttribute('radius-inner', rSize - 0.4); 
        outerBorder.setAttribute('radius-outer', rSize);
        outerBorder.setAttribute('rotation', '-90 0 0');
        outerBorder.setAttribute('position', '0 0.01 0'); 
        outerBorder.setAttribute('material', 'color: #ff0000; opacity: 1; transparent: false; roughness: 1; metalness: 0');

        ringWrapper.appendChild(innerFill);
        ringWrapper.appendChild(outerBorder);
        this.el.appendChild(ringWrapper);
        
        this.activeRings.push(ringWrapper);

        setTimeout(() => {
          if (ringWrapper.parentNode) {
            ringWrapper.parentNode.removeChild(ringWrapper);
          }
          this.activeRings = this.activeRings.filter(r => r !== ringWrapper);
        }, this.data.ringLifespan);
      }
    });

    // 🌟 REWRITTEN WAVE-RIDER COMPONENT: Replaced buggy raycasting with beautiful, buttery-smooth trigonometry!
    AFRAME.registerComponent('wave-rider', {
      schema: {
        amplitude: { default: 0.20 },  // 📏 Control how high/deep the vertical bob is
        speed: { default: 1.2 },       // ⏱️ Locked to match your custom ocean animation speed
        eyeHeight: { default: 0.6 }    // ⚓️ Exact camera elevation off the water
      },
      tick: function (time, timeDelta) {
        let elapsedSeconds = time / 1000;
        let pos = this.el.object3D.position;

        // Uses spatial coordinate offsets mixed with time to form a perfect, continuous rolling swell wave
        let waveValue = Math.sin(elapsedSeconds * this.data.speed + (pos.x * 0.05) + (pos.z * 0.05));
        
        // Apply the smooth height change without any jerky raycasting math spikes
        this.el.object3D.position.y = (waveValue * this.data.amplitude) + this.data.eyeHeight;
      }
    });

    // Slides the shiny water ripples across the heavy rolling swells
    AFRAME.registerComponent('ocean-animator', {
      init: function () {
        this.el.addEventListener('materialtextureloaded', () => {
          this.material = this.el.getObject3D('mesh').material;
        });
      },
      tick: function (time, timeDelta) {
        if (this.material && this.material.normalMap) {
          this.material.normalMap.offset.x = (time * 0.000008);
          this.material.normalMap.offset.y = (time * 0.000004);
        }
      }
    });
  </script>

</body>
</html>
