<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Realistic Ocean - Ambient Sound</title>
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>
  
  <style>
    /* THE MAIN MENU SCREEN OVERLAY */
    #main-menu {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(1, 22, 43, 0.5); 
      backdrop-filter: blur(4px);       
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      transition: opacity 0.5s ease-out;
    }

    #menu-title {
      color: white;
      font-size: 48px;
      letter-spacing: 4px;
      margin-bottom: 30px;
      text-transform: uppercase;
      text-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5);
    }

    #audio-button {
      padding: 18px 40px;
      font-size: 20px;
      font-weight: bold;
      color: white;
      background: #346fa8;
      border: 2px solid white;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #audio-button:hover {
      background: #29547d;
      transform: scale(1.05);
    }

    /* ⏱️ UPDATED SURVIVAL HUD CLOCK STYLE: Right-aligned and low opacity */
    #survival-hud {
      position: fixed;
      top: 25px;
      right: 30px; /* 📍 Pinned to the top-right part of the screen */
      z-index: 999;
      display: none; 
      background: rgba(0, 10, 20, 0.35); /* 🌫️ Lowered opacity from 0.75 to 0.35 */
      padding: 12px 25px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1); /* 🌫️ Softened border edge opacity */
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      font-family: 'Courier New', Courier, monospace;
      color: #64dfdf;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 2px;
      text-align: center;
    }

    /* 💧 HYDRATION BAR CONTAINER HUD STYLE */
    #hydration-bar-container {
      position: fixed;
      top: 25px;
      left: 30px; /* 📍 Pinned neatly to the left side of the screen */
      z-index: 999;
      display: none; /* Hidden until game starts */
      width: 240px;
      height: 14px;
      background: rgba(0, 0, 0, 0.2);
      border: 4px solid #2a2833; /* Thick structural border frame */
      border-radius: 20px; /* Rounded corners for tube effect */
      padding: 2px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    /* Dynamic internal fluid core of the Hydration Bar */
    #hydration-bar-fluid {
      width: 100%; /* Starts fully loaded */
      height: 100%;
      background-color: #2e3085; /* Starting full color: Solid blue */
      border-radius: 20px;
      transition: width 0.3s ease, background-color 0.5s ease; /* Smooth shifts */
    }

    /* ❤️ NEW HEALTH BAR CONTAINER HUD STYLE */
    #health-bar-container {
      position: fixed;
      top: 65px; /* 📍 Stacked cleanly below the hydration bar */
      left: 30px;
      z-index: 999;
      display: none; /* Hidden until game starts */
      width: 240px;
      height: 14px;
      background: rgba(0, 0, 0, 0.2);
      border: 4px solid #2a2833; /* Matching thick structural border frame */
      border-radius: 20px;
      padding: 2px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    /* Dynamic internal fluid core of the Health Bar */
    #health-bar-fluid {
      width: 100%; /* Starts fully loaded */
      height: 100%;
      background-color: #2E8562; /* Starting full color: Custom Green */
      border-radius: 20px;
      transition: width 0.3s ease, background-color 0.5s ease;
    }

    /* 🖤 FULL BLACK GAME OVER OVERLAY SCREEN */
    #game-over-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      z-index: 10000; /* Layers directly over everything else when active */
      display: none; 
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* ⚪ UPDATED GAME OVER TEXT STYLE: White, Up-Centered alignment, and dynamic Fade-In animation */
    #game-over-text {
      color: #ffffff;
      font-size: 64px;
      font-weight: bold;
      letter-spacing: 6px;
      text-transform: uppercase;
      text-shadow: 0px 4px 15px rgba(255, 255, 255, 0.2);
      margin-bottom: 15vh; /* 📍 Pushes the text up toward the upper-center of the viewport */
    }

    /* Triggers the fade effect when the screen transitions to block/flex */
    #game-over-screen[style*="display: flex"] #game-over-text {
      animation: textFadeIn 1.5s ease-out forwards;
    }

    @keyframes textFadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
  </style>
</head>
<body>

  <div id="main-menu">
    <h1 id="menu-title">Lost At Sea</h1>
    <button id="audio-button">Survive...</button>
  </div>

  <div id="survival-hud">TIME: 05:00 AM</div>
  
  <div id="hydration-bar-container">
    <div id="hydration-bar-fluid"></div>
  </div>

  <div id="health-bar-container">
    <div id="health-bar-fluid"></div>
  </div>

  <div id="game-over-screen">
    <div id="game-over-text">GAME OVER</div>
  </div>

  <a-scene id="scene" ring-spawner="playerRig: #rig; enabled: false">
    
    <a-assets>
      <audio id="ambient-sea" 
             src="ocean survival.mp3"
             preload="auto" 
             loop="false"></audio>
    </a-assets>

    <a-entity environment="
      preset: dream; 
      skyType: gradient; 
      skyColor: #415366; 
      horizonColor: #7f8c9d; 
      dressing: none; 
      ground: none; 
      lighting: distant; 
      sunPosition: 0 4 -20
    "></a-entity>

    <a-entity id="rig" 
              position="0 0 0" 
              wave-rider="amplitude: 0.03; speed: 0.5; eyeHeight: 1.7; maxCeiling: 1.8"
              sound="src: #ambient-sea; autoplay: false; loop: false; volume: 0.8; positional: false">
      <a-entity id="camera" camera look-controls wasd-controls="enabled: false; acceleration: 25"></a-entity>
    </a-entity>

    <a-entity id="ocean" 
              ocean="density: 50; amplitude: 0.8; width: 1000; depth: 1000; speed: 1.2"
              material="
                color: #346fa8; 
                roughness: 0.15; 
                metalness: 0.7; 
                opacity: 0.85; 
                transparent: true;
                repeat: 50 50;
                normalMap: https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/waternormals.jpg;
                normalTextureRepeat: 50 50;
              "
              rotation="-90 0 0"
              class="collidable"
              ocean-animator>
    </a-entity>

    <a-cylinder id="ocean-depth"
                position="0 -26.5 0"
                radius="500"
                height="50"
                material="color: #29547d; roughness: 1; metalness: 0; side: double">
    </a-cylinder>

  </a-scene>

  <script>
    // TIME ARCHITECTURE SYSTEM VARIABLES
    let gameHours = 5;
    let gameMinutes = 0;
    let clockInterval = null;
    
    // HYDRATION SYSTEM ENGINE VARIABLES
    let currentHydrationValue = 100;
    let hydrationDrainInterval = null;

    // HEALTH SYSTEM ENGINE VARIABLES
    let currentHealthValue = 100;
    let healthDrainInterval = null;

    // Menu Controller & Game Starter Trigger
    document.getElementById('audio-button').addEventListener('click', function() {
      var rig = document.getElementById('rig');
      rig.components.sound.playSound(); 

      var camera = document.getElementById('camera');
      camera.setAttribute('wasd-controls', 'enabled: true');

      var scene = document.getElementById('scene');
      scene.setAttribute('ring-spawner', 'enabled: true');

      // Trigger HUD reveals and begin timing checks
      var hud = document.getElementById('survival-hud');
      hud.style.display = 'block';
      
      var hydrationHUD = document.getElementById('hydration-bar-container');
      hydrationHUD.style.display = 'block';

      var healthHUD = document.getElementById('health-bar-container');
      healthHUD.style.display = 'block';
      
      startSurvivalClock();
      
      // Starts draining systems dynamically now that the session has begun
      startSurvivalDrainSystems();

      var menu = document.getElementById('main-menu');
      menu.style.opacity = '0';
      setTimeout(function() {
        menu.style.display = 'none';
      }, 500); 
    });

    // CLOCK CONTROLLER FUNCTION
    function startSurvivalClock() {
      clockInterval = setInterval(() => {
        gameMinutes += 15;
        
        if (gameMinutes >= 60) {
          gameMinutes = 0;
          gameHours += 1;
        }

        let displayHours = gameHours.toString().padStart(2, '0');
        let displayMinutes = gameMinutes.toString().padStart(2, '0');
        
        let hudElement = document.getElementById('survival-hud');
        hudElement.innerText = `TIME: ${displayHours}:${displayMinutes} AM`;

      }, 30000); 
    }

    // 🌊 SURVIVAL DRAIN METERS ENGINE: Runs the countdown metrics
    function startSurvivalDrainSystems() {
      // Hydration Drain Setup (10% every 10 seconds)
      hydrationDrainInterval = setInterval(() => {
        let newHydrationTotal = currentHydrationValue - 10;
        if (newHydrationTotal <= 0) {
          newHydrationTotal = 0;
          updateHydrationBarDisplay(newHydrationTotal);
          triggerGameOver();
        } else {
          updateHydrationBarDisplay(newHydrationTotal);
        }
      }, 10000);

      // Health Drain Setup (Behaves exactly like the hydration loop)
      healthDrainInterval = setInterval(() => {
        let newHealthTotal = currentHealthValue - 10;
        if (newHealthTotal <= 0) {
          newHealthTotal = 0;
          updateHealthBarDisplay(newHealthTotal);
          triggerGameOver();
        } else {
          updateHealthBarDisplay(newHealthTotal);
        }
      }, 10000);
    }

    // SYSTEM GAME OVER TRIGGER (Modified to display full black screen overlay layout on 0%)
    function triggerGameOver() {
      clearInterval(hydrationDrainInterval);
      clearInterval(healthDrainInterval);
      clearInterval(clockInterval);

      / 📻 STOP THE BACKGROUND AMBIENT AUDIO TRACK
      document.getElementById('rig').components.sound.stopSound();
      // Deactivate spawning modules
      document.getElementById('scene').setAttribute('ring-spawner', 'enabled: false');

      // Pop the clean black fullscreen layout overlay up
      let screenElement = document.getElementById('game-over-screen');
      screenElement.style.display = 'flex';
    }

    // 🍾 REPLENISHMENT FUNCTION ARCHITECTURE (Stands ready for integration)
    function collectWaterBottle() {
      let restoredHydrationTotal = Math.min(100, currentHydrationValue + 10);
      updateHydrationBarDisplay(restoredHydrationTotal);
    }

    // 💧 CORE FUNCTION TO MANAGE AND UPDATE THE HYDRATION BAR GRADIENT SHIFTS
    function updateHydrationBarDisplay(targetPercentage) {
      currentHydrationValue = Math.max(0, Math.min(100, targetPercentage));
      let fluidElement = document.getElementById('hydration-bar-fluid');
      fluidElement.style.width = `${currentHydrationValue}%`;
      
      if (currentHydrationValue > 50) {
        fluidElement.style.backgroundColor = "#2e3085"; // blue
        } else if (currentHydrationValue <= 50 && currentHydrationValue > 35) {
          fluidElement.style.backgroundColor = "#45235c"; // purple
      } else {
        fluidElement.style.backgroundColor = "#732536"; // Deep Red
      }
    }

    // ❤️ CORE FUNCTION TO MANAGE AND UPDATE THE HEALTH BAR GRADIENT SHIFTS
    function updateHealthBarDisplay(targetPercentage) {
      currentHealthValue = Math.max(0, Math.min(100, targetPercentage));
      let fluidElement = document.getElementById('health-bar-fluid');
      fluidElement.style.width = `${currentHealthValue}%`;
      
      if (currentHealthValue > 50) {
        fluidElement.style.backgroundColor = "#2E8562"; // Stable Green
      } else if (currentHealthValue <= 50 && currentHealthValue > 35) {
        fluidElement.style.backgroundColor = "#785122"; // Warning Amber/Yellow
      } else {
        fluidElement.style.backgroundColor = "#732536"; // Danger Red
      }
    }

    // GAME SPAWNER: Localized ring generator (Locked Settings)
    AFRAME.registerComponent('ring-spawner', {
      schema: {
        playerRig: { type: 'selector' },     
        enabled: { default: false },
        spawnMinTime: { default: 1000 },    
        spawnMaxTime: { default: 6000 },    
        maxActiveRings: { default: 2 },     
        ringRadius: { default: 10 },        
        ringLifespan: { default: 6000 },    
        minSpawnRadius: { default: 2 },     
        maxSpawnRadius: { default: 15 }     
      },
      init: function () {
        this.activeRings = [];
        this.timer = 0;
        this.nextSpawnTime = this.getNewSpawnTime();
      },
      getNewSpawnTime: function () {
        return Math.random() * (this.data.spawnMaxTime - this.data.spawnMinTime) + this.data.spawnMinTime;
      },
      tick: function (time, timeDelta) {
        if (!this.data.enabled) return;

        this.timer += timeDelta;

        if (this.timer >= this.nextSpawnTime) {
          this.timer = 0;
          this.nextSpawnTime = this.getNewSpawnTime();
          
          if (this.activeRings.length < this.data.maxActiveRings) {
            this.spawnRing();
          }
        }
      },
      spawnRing: function () {
        if (!this.data.playerRig) return;

        let playerPos = this.data.playerRig.object3D.position;
        let attempts = 0;
        let validPosition = false;
        let spawnX = 0;
        let spawnZ = 0;
        let rSize = this.data.ringRadius;
        let minClearance = 25; 

        while (!validPosition && attempts < 45) {
          attempts++;
          
          let angle = Math.random() * Math.PI * 2;
          let relativeDistance = Math.random() * (this.data.maxSpawnRadius - this.data.minSpawnRadius) + this.data.minSpawnRadius;
          
          spawnX = playerPos.x + (Math.cos(angle) * relativeDistance);
          spawnZ = playerPos.z + (Math.sin(angle) * relativeDistance);

          validPosition = true;

          for (let i = 0; i < this.activeRings.length; i++) {
            let activeRing = this.activeRings[i];
            let existingPos = activeRing.getAttribute('position');
            
            if (existingPos) {
              let dx = spawnX - existingPos.x;
              let dz = spawnZ - existingPos.z;
              let currentDist = Math.sqrt(dx * dx + dz * dz);

              if (currentDist < minClearance) {
                validPosition = false;
                break;
              }
            }
          }
        }

        if (!validPosition) return; 

        let ringWrapper = document.createElement('a-entity');
        ringWrapper.setAttribute('position', `${spawnX} 0 ${spawnZ}`);
        
        ringWrapper.setAttribute('wave-rider', {
          amplitude: 0.02,
          speed: 1.0,
          eyeHeight: 0.01,
          maxCeiling: 0.05
        });

        let innerFill = document.createElement('a-ring');
        innerFill.setAttribute('radius-inner', '0');
        innerFill.setAttribute('radius-outer', rSize);
        innerFill.setAttribute('rotation', '-90 0 0');
        innerFill.setAttribute('material', 'color: #ff0000; opacity: 0.6; transparent: true; roughness: 1; metalness: 0');

        let outerBorder = document.createElement('a-ring');
        outerBorder.setAttribute('radius-inner', rSize - 0.4); 
        outerBorder.setAttribute('radius-outer', rSize);
        outerBorder.setAttribute('rotation', '-90 0 0');
        outerBorder.setAttribute('position', '0 0.01 0'); 
        outerBorder.setAttribute('material', 'color: #ff0000; opacity: 1; transparent: false; roughness: 1; metalness: 0');

        ringWrapper.appendChild(innerFill);
        ringWrapper.appendChild(outerBorder);
        this.el.appendChild(ringWrapper);
        
        this.activeRings.push(ringWrapper);

        setTimeout(() => {
          if (ringWrapper.parentNode) {
            ringWrapper.parentNode.removeChild(ringWrapper);
          }
          this.activeRings = this.activeRings.filter(r => r !== ringWrapper);
        }, this.data.ringLifespan);
      }
    });

    // WAVE-RIDER COMPONENT (Locked Settings)
    AFRAME.registerComponent('wave-rider', {
      schema: {
        amplitude: { default: 0.03 },  
        speed: { default: 1.0 },       
        eyeHeight: { default: 0.5 },   
        maxCeiling: { default: 0.54 }  
      },
      tick: function (time, timeDelta) {
        let elapsedSeconds = time / 1000;
        let steadyFloat = Math.sin(elapsedSeconds * this.data.speed);
        let calculatedHeight = (steadyFloat * this.data.amplitude) + this.data.eyeHeight;
        this.el.object3D.position.y = Math.min(calculatedHeight, this.data.maxCeiling);
      }
    });

    // Slides the shiny water ripples across the heavy rolling swells
    AFRAME.registerComponent('ocean-animator', {
      init: function () {
        this.el.addEventListener('materialtextureloaded', () => {
          this.material = this.el.getObject3D('mesh').material;
        });
      },
      tick: function (time, timeDelta) {
        if (this.material && this.material.normalMap) {
          this.material.normalMap.offset.x = (time * 0.000008);
          this.material.normalMap.offset.y = (time * 0.000004);
        }
      }
    });
  </script>

</body>
</html>
