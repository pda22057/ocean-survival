<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Realistic Ocean - Ambient Sound</title>
  
  <base href="./">

  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-environment-component@1.3.7/dist/aframe-environment-component.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>
  
  <style>
    /* THE MAIN MENU SCREEN OVERLAY */
    #main-menu {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(1, 22, 43, 0.5); 
      backdrop-filter: blur(4px);       
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      transition: opacity 0.5s ease-out;
    }

    #menu-title {
      color: white;
      font-size: 48px;
      letter-spacing: 4px;
      margin-bottom: 30px;
      text-transform: uppercase;
      text-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5);
    }

    #audio-button {
      padding: 18px 40px;
      font-size: 20px;
      font-weight: bold;
      color: white;
      background: #346fa8;
      border: 2px solid white;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #audio-button:hover {
      background: #29547d;
      transform: scale(1.05);
    }

    /* ⏱️ SURVIVAL HUD CLOCK STYLE */
    #survival-hud {
      position: fixed;
      top: 25px;
      right: 30px;
      z-index: 999;
      display: none; 
      background: rgba(0, 10, 20, 0.35);
      padding: 12px 25px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      font-family: 'Courier New', Courier, monospace;
      color: #64dfdf;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 2px;
      text-align: center;
    }

    /* 💧 HYDRATION BAR CONTAINER HUD STYLE */
    #hydration-bar-container {
      position: fixed;
      top: 25px;
      left: 30px;
      z-index: 999;
      display: none;
      width: 240px;
      height: 14px;
      background: rgba(0, 0, 0, 0.2);
      border: 4px solid #2a2833;
      border-radius: 20px;
      padding: 2px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    #hydration-bar-fluid {
      width: 100%;
      height: 100%;
      background-color: #2e3085;
      border-radius: 20px;
      transition: width 0.3s ease, background-color 0.5s ease;
    }

    /* ❤️ HEALTH BAR CONTAINER HUD STYLE */
    #health-bar-container {
      position: fixed;
      top: 65px;
      left: 30px;
      z-index: 999;
      display: none;
      width: 240px;
      height: 14px;
      background: rgba(0, 0, 0, 0.2);
      border: 4px solid #2a2833;
      border-radius: 20px;
      padding: 2px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    #health-bar-fluid {
      width: 100%;
      height: 100%;
      background-color: #2E8562;
      border-radius: 20px;
      transition: width 0.3s ease, background-color 0.5s ease;
    }

    /* 🖤 FULL BLACK GAME OVER SCREEN FOR LOSING */
    #game-over-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      z-index: 10000;
      display: none; 
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #game-over-text {
      color: #ffffff;
      font-size: 64px;
      font-weight: bold;
      letter-spacing: 6px;
      text-transform: uppercase;
      text-shadow: 0px 4px 15px rgba(255, 255, 255, 0.2);
    }

    #game-over-screen[style*="display: flex"] {
      animation: textFadeIn 1.5s ease-out forwards;
    }

    /* 🚁 WHITE SCREEN OVERLAY FOR WINNING */
    #win-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      z-index: 10000;
      display: none; 
      opacity: 0;
    }

    /* 🎬 WHITE FADE ANIMATION (Takes 2.5s, starts after 1.5s freeze) */
    #win-screen[style*="display: flex"] {
      animation: spotlightFadeIn 2.5s ease-in 1.5s forwards; 
    }

    /* 📄 INDIVIDUAL FULL-SCREEN STORY SLIDES */
    .story-slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none; 
      justify-content: center;
      align-items: center;
      padding: 0 40px;
      box-sizing: border-box;
      text-align: center;
    }

    /* Displays the active slide and triggers text fade animation */
    .story-slide.active-slide {
      display: flex !important;
      animation: textFadeIn 1.0s ease-out forwards;
