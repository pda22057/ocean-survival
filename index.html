<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Realistic Ocean - Ambient Sound</title>
  
  <base href="./">

  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-environment-component@1.3.7/dist/aframe-environment-component.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>
  
  <style>
    /* THE MAIN MENU SCREEN OVERLAY (Kept in flat HTML as standard for VR entering) */
    #main-menu {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(1, 22, 43, 0.5); 
      backdrop-filter: blur(4px);       
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      transition: opacity 0.5s ease-out;
    }

    #menu-title {
      color: white;
      font-size: 48px;
      letter-spacing: 4px;
      margin-bottom: 30px;
      text-transform: uppercase;
      text-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5);
    }

    #audio-button {
      padding: 18px 40px;
      font-size: 20px;
      font-weight: bold;
      color: white;
      background: #346fa8;
      border: 2px solid white;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #audio-button:hover {
      background: #29547d;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div id="main-menu">
    <h1 id="menu-title">Lost At Sea</h1>
    <button id="audio-button">Survive...</button>
  </div>

  <a-scene id="scene" ring-spawner="playerRig: #rig; enabled: false; minSpawnRadius: 15; maxSpawnRadius: 40" bottle-spawner="playerRig: #rig; enabled: false">
    
    <a-assets>
      <audio id="ambient-sea" 
             src="https://pda22057.github.io/ocean-survival/assets/models/ocean_survival2.mp3" 
             preload="auto" 
             loop="true"></audio>
      <audio id="helicopter-sound" 
             src="https://pda22057.github.io/ocean-survival/assets/models/helicopter.mp3" 
             preload="auto"></audio> 
      <a-asset-item id="boat-model" src="https://pda22057.github.io/ocean-survival/assets/models/fishing_boat.glb"></a-asset-item>
      <a-asset-item id="bottle-model" src="https://pda22057.github.io/ocean-survival/assets/models/water_canteen_-_pbr_game_ready_asset.glb"></a-asset-item>
      <a-asset-item id="shark-model" src="https://pda22057.github.io/ocean-survival/assets/models/swimming_shark.glb"></a-asset-item>
    </a-assets>

    <a-entity environment="
      preset: dream; 
      skyType: gradient; 
      skyColor: #415366; 
      horizonColor: #7f8c9d; 
      dressing: none; 
      ground: none; 
      lighting: distant; 
      sunPosition: 0 4 -20
    "></a-entity>

    <a-entity id="rig" 
              position="0 0 0" 
              wasd-controls="enabled: false; acceleration: 25"
              look-controls="enabled: false; pointerLockEnabled: true"
              sound="src: #ambient-sea; autoplay: false; loop: true; volume: 0.8"
              boat-leveler>

      <a-entity id="camera" camera position="0 3.5 0">
        
        <a-entity id="vr-hud" position="0 0 -1" visible="false">
          <a-text id="hud-clock" value="TIME: 05:00 AM" color="#64dfdf" width="1.5" align="center" position="0 0.4 0"></a-text>
          
          <a-text value="HYDRATION" color="#ffffff" width="0.8" align="center" position="-0.4 0.3 0"></a-text>
          <a-plane id="hud-hydration-bg" color="#2a2833" width="0.4" height="0.04" position="-0.4 0.25 0">
            <a-plane id="hud-hydration-fluid" color="#2e3085" width="0.38" height="0.03" position="0 0 0.001"></a-plane>
          </a-plane>

          <a-text value="HEALTH" color="#ffffff" width="0.8" align="center" position="0.4 0.3 0"></a-text>
          <a-plane id="hud-health-bg" color="#2a2833" width="0.4" height="0.04" position="0.4 0.25 0">
            <a-plane id="hud-health-fluid" color="#2E8562" width="0.38" height="0.03" position="0 0 0.001"></a-plane>
          </a-plane>
        </a-entity>

        <a-entity id="vr-game-over" position="0 0 -0.5" visible="false">
          <a-plane color="#000000" width="2" height="2" position="0 0 0"></a-plane>
          <a-text value="GAME OVER\n\nsharks attacked you" color="#ffffff" width="1.2" align="center" position="0 0 0.01"></a-text>
        </a-entity>

        <a-entity id="vr-win-screen" position="0 0 -0.5" visible="false">
          <a-plane id="win-flash-plane" color="#ffffff" material="opacity: 0; transparent: true" width="2" height="2" position="0 0 0"></a-plane>
          <a-text id="vr-story-text" value="" color="#01162b" width="0.9" align="center" position="0 0 0.01" visible="false"></a-text>
        </a-entity>

      </a-entity>
      
      <a-entity id="player-boat"
                gltf-model="#boat-model"
                position="0 3.2 -0.5"
                rotation="0 180 0"
                scale="5 5 5"
                visible="false">
      </a-entity>

    </a-entity>

    <a-entity id="ocean" 
              ocean="density: 50; amplitude: 0.8; width: 1000; depth: 1000; speed: 1.2"
              material="
                color: #346fa8; 
                roughness: 0.15; 
                metalness: 0.7; 
                opacity: 0.85; 
                transparent: true;
                repeat: 50 50;
                normalMap: https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/waternormals.jpg;
                normalTextureRepeat: 50 50;
              "
              rotation="-90 0 0"
              class="collidable"
              ocean-animator>
    </a-entity>

    <a-cylinder id="ocean-depth"
                position="0 -26.5 0"
                radius="500"
                height="50"
                material="color: #29547d; roughness: 1; metalness: 0; side: double">
    </a-cylinder>

  </a-scene>

  <script>
    let gameHours = 5;
    let gameMinutes = 0;
    let clockInterval = null;
    
    let currentHydrationValue = 100;
    let hydrationDrainInterval = null;

    let currentHealthValue = 100;
    let healthSystemActive = false; 

    // Text strings array used by the 3D VR win text renderer
    const storySlidesData = [
      "Congratulations, you survived",
      "After hours of being in the open ocean, rescue has finally arrived",
      "The search team spotted your signal of the phone and safely saved you, bringing you inside the helicopter, where medical assistance is already waiting",
      "What began as a fight for survival has become a story you'll carry with you for the rest of your life",
      "a tale that may one day be passed on to future generations"
    ];

    document.getElementById('audio-button').addEventListener('click', function() {
      var rig = document.getElementById('rig');
      if (rig) {
        rig.setAttribute('wasd-controls', 'enabled: true');
        rig.setAttribute('look-controls', 'enabled: true');
        
        if (rig.components && rig.components.sound) {
          rig.components.sound.playSound(); 
        }
      }

      var boat = document.getElementById('player-boat');
      if (boat) {
        boat.setAttribute('visible', 'true');
      }

      var scene = document.getElementById('scene');
      if (scene) {
        scene.setAttribute('ring-spawner', 'enabled: true');
        scene.setAttribute('bottle-spawner', 'enabled: true');
        scene.emit('start-spawning');
      }

      // FIXED: Shows the new VR-compatible 3D HUD floating group instead of old HTML blocks
      var vrHUD = document.getElementById('vr-hud');
      if (vrHUD) vrHUD.setAttribute('visible', 'true');
      
      startSurvivalClock();
      startSurvivalDrainSystems();
      healthSystemActive = true;

      var menu = document.getElementById('main-menu');
      if (menu) {
        menu.style.opacity = '0';
        setTimeout(function() {
          menu.style.display = 'none';
        }, 500); 
      }
    });

    function startSurvivalClock() {
      clockInterval = setInterval(() => {
        gameMinutes += 15;
        if (gameMinutes >= 60) {
          gameMinutes = 0;
          gameHours += 1;
        }
        let displayHours = gameHours.toString().padStart(2, '0');
        let displayMinutes = gameMinutes.toString().padStart(2, '0');
        
        // FIXED: Updates 3D VR text component value attribute instead of innerText
        let vrClock = document.getElementById('hud-clock');
        if (vrClock) vrClock.setAttribute('value', `TIME: ${displayHours}:${displayMinutes} AM`);

        if (gameHours === 7 && gameMinutes === 0) {
          triggerWin();
        }
      }, 30000); 
    }

    function startSurvivalDrainSystems() {
      hydrationDrainInterval = setInterval(() => {
        let newHydrationTotal = currentHydrationValue - 10;
        if (newHydrationTotal <= 0) {
          newHydrationTotal = 0;
          updateHydrationBarDisplay(newHydrationTotal);
          
          let newHealthTotal = currentHealthValue - 5;
          if (newHealthTotal <= 0) {
            newHealthTotal = 0;
            updateHealthBarDisplay(newHealthTotal);
            triggerLoss(); 
          } else {
            updateHealthBarDisplay(newHealthTotal);
          }
        } else {
          updateHydrationBarDisplay(newHydrationTotal);
        }
      }, 10000);
    }

    // 💀 LOSING ENDING (Pitch black VR mesh)
    function triggerLoss() {
      clearInterval(hydrationDrainInterval);
      clearInterval(clockInterval);
      healthSystemActive = false;
      
      let scene = document.getElementById('scene');
      if (scene) {
        scene.setAttribute('ring-spawner', 'enabled: false');
        scene.setAttribute('bottle-spawner', 'enabled: false');
      }
      
      let rig = document.getElementById('rig');
      if (rig) rig.setAttribute('wasd-controls', 'enabled: false');

      // Hide active HUD container
      let vrHUD = document.getElementById('vr-hud');
      if (vrHUD) vrHUD.setAttribute('visible', 'false');

      // FIXED: Display the 3D VR Game Over space object layer
      let lossElement = document.getElementById('vr-game-over');
      if (lossElement) lossElement.setAttribute('visible', 'true');
    }

    // 🚁 WINNING ENDING (White flash inside headset + dynamic narrative panels)
    function triggerWin() {
      clearInterval(hydrationDrainInterval);
      clearInterval(clockInterval);
      healthSystemActive = false;
      
      let scene = document.getElementById('scene');
      if (scene) {
        scene.setAttribute('ring-spawner', 'enabled: false');
        scene.setAttribute('bottle-spawner', 'enabled: false');
        
        let existingBottles = scene.querySelectorAll('[gltf-model="#bottle-model"]');
        existingBottles.forEach(bottle => {
          if (bottle.parentNode) bottle.parentNode.removeChild(bottle);
        });

        let existingRings = scene.querySelectorAll('a-entity[wave-rider]');
        existingRings.forEach(ring => {
          if (ring.id !== 'rig') {
            if (ring.parentNode) ring.parentNode.removeChild(ring);
          }
        });
      }

      let rig = document.getElementById('rig');
      if (rig) rig.setAttribute('wasd-controls', 'enabled: false');

      let helicopterAudio = document.getElementById('helicopter-sound');
      if (helicopterAudio) {
        helicopterAudio.volume = 0.9;
        helicopterAudio.play().catch(err => console.log("Audio exception:", err));
      }

      // Hide HUD bars
      let vrHUD = document.getElementById('vr-hud');
      if (vrHUD) vrHUD.setAttribute('visible', 'false');
      
      // FIXED: Shows the 3D VR screen framework structure container
      let winElement = document.getElementById('vr-win-screen');
      if (winElement) winElement.setAttribute('visible', 'true');

      // Manual animation processing loop for the 3D white flash overlay inside headset
      let flashPlane = document.getElementById('win-flash-plane');
      let opacityCounter = 0;
      setTimeout(() => {
        let flashInterval = setInterval(() => {
          opacityCounter += 0.02;
          if (flashPlane) flashPlane.setAttribute('material', `opacity: ${opacityCounter}; transparent: true`);
          if (opacityCounter >= 1) {
            clearInterval(flashInterval);
          }
        }, 50); // Simulates standard spotlightFadeIn styling keyframes in 3D 
      }, 1500);

      // ⏱️ SEQUENTIAL TIMEOUT ROUTE TO SWAP STORY VALUES
      setTimeout(() => { showVRStorySlide(0); }, 4000);
      setTimeout(() => { showVRStorySlide(1); }, 10000);
      setTimeout(() => { showVRStorySlide(2); }, 25000);
      setTimeout(() => { showVRStorySlide(3); }, 31000);
      setTimeout(() => { showVRStorySlide(4); }, 37000);
    }

    // FIXED: Formats textual asset arrays directly onto the 3D VR camera viewport engine layout
    function showVRStorySlide(index) {
      let vrTextEl = document.getElementById('vr-story-text');
      if (vrTextEl) {
        vrTextEl.setAttribute('visible', 'true');
        vrTextEl.setAttribute('value', storySlidesData[index].toUpperCase());
      }
    }

    function collectWaterBottle() {
      let restoredHydrationTotal = Math.min(100, currentHydrationValue + 5);
      updateHydrationBarDisplay(restoredHydrationTotal);
    }

    // FIXED: Modifies width scaling values of the 3D a-plane bars instead of flat browser CSS styles
    function updateHydrationBarDisplay(targetPercentage) {
      currentHydrationValue = Math.max(0, Math.min(100, targetPercentage));
      let fluidElement = document.getElementById('hud-hydration-fluid');
      if (fluidElement) {
        let calculatedWidth = (currentHydrationValue / 100) * 0.38;
        fluidElement.setAttribute('width', calculatedWidth);
        
        // Shifts position point dynamically to prevent the scale bar from shrinking from both sides
        fluidElement.setAttribute('position', `${(calculatedWidth / 2) - 0.19} 0 0.001`);

        if (currentHydrationValue > 50) {
          fluidElement.setAttribute('color', "#2e3085");
        } else if (currentHydrationValue <= 50 && currentHydrationValue > 35) {
          fluidElement.setAttribute('color', "#45235c");
        } else {
          fluidElement.setAttribute('color', "#732536");
        }
      }
    }

    // FIXED: Modifies width scaling values of the 3D a-plane bars instead of flat browser CSS styles
    function updateHealthBarDisplay(targetPercentage) {
      currentHealthValue = Math.max(0, Math.min(100, targetPercentage));
      let fluidElement = document.getElementById('hud-health-fluid');
      if (fluidElement) {
        let calculatedWidth = (currentHealthValue / 100) * 0.38;
        fluidElement.setAttribute('width', calculatedWidth);
        fluidElement.setAttribute('position', `${(calculatedWidth / 2) - 0.19} 0 0.001`);

        if (currentHealthValue > 50) {
          fluidElement.setAttribute('color', "#2E8562");
        } else if (currentHealthValue <= 50 && currentHealthValue > 35) {
          fluidElement.setAttribute('color', "#785122");
        } else {
          fluidElement.setAttribute('color', "#732536");
        }
      }
    }

    AFRAME.registerComponent('boat-leveler', {
      tick: function () {
        let currentRotation = this.el.object3D.rotation;
        this.el.object3D.rotation.set(0, currentRotation.y, 0);
      }
    });

    // 🍾 BOTTLE SPAWNER COMPONENT
    AFRAME.registerComponent('bottle-spawner', {
      schema: {
        playerRig: { type: 'selector' },
        enabled: { default: false },
        maxBottles: { default: 25 },         
        spawnDelay: { default: 8000 },      
        minRadius: { default: 20 },
        maxRadius: { default: 350 }
      },
      init: function () {
        this.activeBottles = [];
        
        this.el.addEventListener('start-spawning', () => {
          for (let i = 0; i < this.data.maxBottles; i++) {
            this.spawnBottle();
          }
        });
      },
      tick: function () {
        if (!this.data.enabled || !this.data.playerRig) return;

        let playerPos = this.data.playerRig.object3D.position;
        for (let i = this.activeBottles.length - 1; i >= 0; i--) {
          let bottleEl = this.activeBottles[i];
          let bottlePos = bottleEl.object3D.position;
          
          let dx = playerPos.x - bottlePos.x;
          let dz = playerPos.z - bottlePos.z;
          let distance = Math.sqrt(dx * dx + dz * dz);

          if (distance < 3.5) { 
            collectWaterBottle(); 
            this.removeBottle(bottleEl, false); 
          }
        }
      },
      spawnBottle: function () {
        let playerPos = this.data.playerRig.object3D.position;
        
        let angle = Math.random() * Math.PI * 2;
        let distance = Math.random() * (this.data.maxRadius - this.data.minRadius) + this.data.minRadius;
        
        let spawnX = playerPos.x + Math.cos(angle) * distance;
        let spawnZ = playerPos.z + Math.sin(angle) * distance;

        let bottle = document.createElement('a-entity');
        bottle.setAttribute('gltf-model', '#bottle-model');
        bottle.setAttribute('position', `${spawnX} 0.3 ${spawnZ}`); 
        bottle.setAttribute('scale', '4 4 4'); 
        
        bottle.setAttribute('wave-rider', {
          amplitude: 0.05,
          speed: 1.5,
          eyeHeight: 0.3,maxCeiling: 0.5
        });

        this.el.appendChild(bottle);
        this.activeBottles.push(bottle);

        let randomLifespan = Math.random() * (35000 - 20000) + 20000;

        let self = this;
        bottle.expiryTimeout = setTimeout(function() {
          self.removeBottle(bottle, true); 
        }, randomLifespan);
      },
      removeBottle: function (bottleEl, isExpiry) {
        if (bottleEl.expiryTimeout) clearTimeout(bottleEl.expiryTimeout);
        
        let index = this.activeBottles.indexOf(bottleEl);
        if (index > -1) {
          this.activeBottles.splice(index, 1);
          if (bottleEl.parentNode) {
            bottleEl.parentNode.removeChild(bottleEl);
          }

          if (this.data.enabled) {
            if (isExpiry) {
              this.spawnBottle();
            } else {
              setTimeout(() => {
                if (this.data.enabled && this.activeBottles.length < this.data.maxBottles) {
                  this.spawnBottle();
                }
              }, this.data.spawnDelay);
            }
          }
        }
      }
    });

    AFRAME.registerComponent('ring-spawner', {
      schema: {
        playerRig: { type: 'selector' },     
        enabled: { default: false },
        spawnMinTime: { default: 1000 },    
        spawnMaxTime: { default: 6000 },    
        maxActiveRings: { default: 2 },     
        ringRadius: { default: 15 },        
        ringLifespan: { default: 6000 },    
        minSpawnRadius: { default: 2 },     
        maxSpawnRadius: { default: 15 }     
      },
      init: function () {
        this.activeRings = [];
        this.timer = 0;
        this.nextSpawnTime = this.getNewSpawnTime();
        this.damageCooldown = 0; 
        
        this.playerWorldPos = new THREE.Vector3();
        this.sharkWorldPos = new THREE.Vector3();
      },
      getNewSpawnTime: function () {
        return Math.random() * (this.data.spawnMaxTime - this.data.spawnMinTime) + this.data.spawnMinTime;
      },
      tick: function (time, timeDelta) {
        if (!this.data.enabled) return;
        
        this.timer += timeDelta;
        if (this.timer >= this.nextSpawnTime) {
          this.timer = 0;
          this.nextSpawnTime = this.getNewSpawnTime();
          if (this.activeRings.length < this.data.maxActiveRings) {
            this.spawnRing();
          }
        }

        if (healthSystemActive && this.data.playerRig) {
          if (this.damageCooldown > 0) {
            this.damageCooldown -= timeDelta;
          }

          let boatVisual = document.getElementById('player-boat');
          if (boatVisual && boatVisual.object3D) {
            boatVisual.object3D.getWorldPosition(this.playerWorldPos);
            
            let rSize = this.data.ringRadius;
            let physicalHitRadius = 3.5; 

            for (let i = 0; i < this.activeRings.length; i++) {
              let activeRing = this.activeRings[i];
              let sharkEntity = activeRing.querySelector('.shark');
              
              if (sharkEntity && sharkEntity.object3D) {
                sharkEntity.object3D.getWorldPosition(this.sharkWorldPos);
                
                let dx = this.playerWorldPos.x - this.sharkWorldPos.x;
                let dz = this.playerWorldPos.z - this.sharkWorldPos.z;
                let distanceToShark = Math.sqrt(dx * dx + dz * dz);

                if (distanceToShark <= physicalHitRadius) {
                  updateHealthBarDisplay(0);
                  triggerLoss(); 
                  return; 
                }

                if (distanceToShark <= rSize && this.damageCooldown <= 0) {
                  let damageAmount = 5; 
                  let newHealth = currentHealthValue - damageAmount;
                  
                  if (newHealth <= 0) {
                    updateHealthBarDisplay(0);
                    triggerLoss(); 
                  } else {
                    updateHealthBarDisplay(newHealth);
                  }
                  this.damageCooldown = 3000; 
                  break; 
                }
              }
            }
          }
        }
      },
      spawnRing: function () {
        if (!this.data.playerRig) return;
        let playerPos = this.data.playerRig.object3D.position;
        let attempts = 0;
        let validPosition = false;
        let spawnX = 0;
        let spawnZ = 0;
        let rSize = this.data.ringRadius;
        let minClearance = 25; 

        while (!validPosition && attempts < 45) {
          attempts++;
          let angle = Math.random() * Math.PI * 2;
          let relativeDistance = Math.random() * (this.data.maxSpawnRadius - this.data.minSpawnRadius) + this.data.minSpawnRadius;
          spawnX = playerPos.x + (Math.cos(angle) * relativeDistance);
          spawnZ = playerPos.z + (Math.sin(angle) * relativeDistance);
          validPosition = true;

          for (let i = 0; i < this.activeRings.length; i++) {
            let activeRing = this.activeRings[i];
            let existingPos = activeRing.getAttribute('position');
            if (existingPos) {
              let dx = spawnX - existingPos.x;
              let dz = spawnZ - existingPos.z;
              let currentDist = Math.sqrt(dx * dx + dz * dz);
              if (currentDist < minClearance) {
                validPosition = false;
                break;
              }
            }
          }
        }

        if (!validPosition) return; 

        let ringWrapper = document.createElement('a-entity');
        ringWrapper.setAttribute('position', `${spawnX} 0 ${spawnZ}`);
        ringWrapper.setAttribute('wave-rider', {
          amplitude: 0.02,
          speed: 1.0,
          eyeHeight: 0.01,
          maxCeiling: 0.05
        });

        let innerFill = document.createElement('a-ring');
        innerFill.setAttribute('radius-inner', '0');
        innerFill.setAttribute('radius-outer', rSize);
        innerFill.setAttribute('rotation', '-90 0 0');
        innerFill.setAttribute('material', 'color: #ff0000; opacity: 0.3; transparent: true; roughness: 1; metalness: 0');
        ringWrapper.appendChild(innerFill);

        let outerBorder1 = document.createElement('a-ring');
        outerBorder1.setAttribute('radius-inner', rSize - 0.4); 
        outerBorder1.setAttribute('radius-outer', rSize);
        outerBorder1.setAttribute('rotation', '-90 0 0');
        outerBorder1.setAttribute('position', '0 0.01 0'); 
        outerBorder1.setAttribute('material', 'color: #ff0000; opacity: 1; transparent: false; roughness: 1; metalness: 0');
        ringWrapper.appendChild(outerBorder1);

        let outerBorder2 = document.createElement('a-ring');
        outerBorder2.setAttribute('radius-inner', (rSize * 0.66) - 0.4); 
        outerBorder2.setAttribute('radius-outer', rSize * 0.66);
        outerBorder2.setAttribute('rotation', '-90 0 0');
        outerBorder2.setAttribute('position', '0 0.011 0'); 
        outerBorder2.setAttribute('material', 'color: #cc0000; opacity: 1; transparent: false; roughness: 1; metalness: 0');
        ringWrapper.appendChild(outerBorder2);

        let outerBorder3 = document.createElement('a-ring');
        outerBorder3.setAttribute('radius-inner', (rSize * 0.33) - 0.4); 
        outerBorder3.setAttribute('radius-outer', rSize * 0.33);
        outerBorder3.setAttribute('rotation', '-90 0 0');
        outerBorder3.setAttribute('position', '0 0.012 0'); 
        outerBorder3.setAttribute('material', 'color: #990000; opacity: 1; transparent: false; roughness: 1; metalness: 0');
        ringWrapper.appendChild(outerBorder3);

        setTimeout(() => {
          if (ringWrapper.parentNode) {
            let shark = document.createElement('a-entity');
            shark.setAttribute('gltf-model', '#shark-model');
            shark.setAttribute('class', 'shark'); 
            shark.setAttribute('position', '0 -2.5 0'); 
            shark.setAttribute('scale', '1.5 1.5 1.5'); 
            shark.setAttribute('animation-mixer', ''); 
            
            shark.addEventListener('model-loaded', () => {
              let boatVisual = document.getElementById('player-boat');
              if (boatVisual && boatVisual.object3D && shark.object3D) {
                let boatWorldPosition = new THREE.Vector3();
                boatVisual.object3D.getWorldPosition(boatWorldPosition);
                
                let sharkWorldPosition = new THREE.Vector3();
                shark.object3D.getWorldPosition(sharkWorldPosition);

                let dx = boatWorldPosition.x - sharkWorldPosition.x;
                let dz = boatWorldPosition.z - sharkWorldPosition.z;

                let angleToPlayer = Math.atan2(dx, dz);
                let modelOffset = Math.PI / 4; 
                
                shark.object3D.rotation.set(0, angleToPlayer + modelOffset, 0);
              }
            });

            ringWrapper.appendChild(shark);
          }
        }, 2000);

        this.el.appendChild(ringWrapper);
        this.activeRings.push(ringWrapper);

        setTimeout(() => {
          if (ringWrapper.parentNode) {
            ringWrapper.parentNode.removeChild(ringWrapper);
          }
          this.activeRings = this.activeRings.filter(r => r !== ringWrapper);
        }, this.data.ringLifespan);
      }
    });

    AFRAME.registerComponent('wave-rider', {
      schema: {
        amplitude: { default: 0.03 },  
        speed: { default: 1.0 },       
        eyeHeight: { default: 0.5 },   
        maxCeiling: { default: 0.54 }  
      },
      tick: function (time, timeDelta) {
        let elapsedSeconds = time / 1000;
        let steadyFloat = Math.sin(elapsedSeconds * this.data.speed);
        let calculatedHeight = (steadyFloat * this.data.amplitude) + this.data.eyeHeight;
        this.el.object3D.position.y = Math.min(calculatedHeight, this.data.maxCeiling);
      }
    });

    AFRAME.registerComponent('ocean-animator', {
      init: function () {
        this.el.addEventListener('materialtextureloaded', () => {
          this.material = this.el.getObject3D('mesh').material;
        });
      },
      tick: function (time, timeDelta) {
        if (this.material && this.material.normalMap) {
          this.material.normalMap.offset.x = (time * 0.000008);
          this.material.normalMap.offset.y = (time * 0.000004);
        }
      }
    });
  </script>
</body>
</html>
